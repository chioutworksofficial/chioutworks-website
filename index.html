    <style>
      #cw-pre{--c-void:#0b0c0e;--c-lilac:#85a6e9;--c-signal:#2862d7;--c-quartz:#fff;position:fixed;inset:0;z-index:2147483000;background:var(--c-void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .2s cubic-bezier(.4,0,.2,1)}
      #cw-pre[data-out]{opacity:0;pointer-events:none}
      html[data-mode=light] #cw-pre{--c-void:#f4f7fc;--c-lilac:#2f63c9;--c-signal:#2459c8;--c-quartz:#0c1530}
      #cw-pre .m{position:relative;display:block;height:56px;width:85px;opacity:0;animation:cwpre-in .5s .05s cubic-bezier(.22,1,.36,1) forwards}
      #cw-pre .m i{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
      #cw-pre .m i:first-child{background:var(--c-lilac);-webkit-mask-image:url(/brand/mark-layer-green.png);mask-image:url(/brand/mark-layer-green.png)}
      #cw-pre .m i:last-child{background:var(--c-quartz);-webkit-mask-image:url(/brand/mark-layer-white.png);mask-image:url(/brand/mark-layer-white.png)}
      #cw-pre .b{display:block;width:56px;height:2px;background:color-mix(in srgb,var(--c-quartz) 14%,transparent);overflow:hidden;opacity:0;animation:cwpre-in .5s .2s forwards}
      #cw-pre .b i{display:block;height:100%;background:linear-gradient(90deg,var(--c-signal),var(--c-lilac));transform:scaleX(0);transform-origin:left}
      @keyframes cwpre-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#cw-pre{transition-duration:.3s}#cw-pre .m,#cw-pre .b{animation:none;opacity:1}#cw-pre .b{display:none}}
    </style>
    <noscript><style>#cw-pre{display:none!important}</style></noscript>
  </head>
  <body>
    <noscript>
      <h1>Chioutworks — Automation, Web Development &amp; AI Integration</h1>
      <p>Chioutworks helps businesses in Germany, Türkiye and Greece automate processes, build web apps and integrate AI.</p>
    </noscript>
    <div id="cw-pre" aria-hidden="true"><span class="m"><i></i><i></i></span><span class="b"><i></i></span></div>
    <script>
      (function () {
        var el = document.getElementById('cw-pre'), skip = false;
        try {
          var seg = location.pathname.split('/').filter(Boolean);
          skip = sessionStorage.getItem('cw-pre') === '1' || /^(admin|dev|demo)$/.test(seg[0] || '') || seg.length > 2;
          var c = JSON.parse(localStorage.getItem('cw-consent') || 'null');
          if (!skip && c && c.functional) sessionStorage.setItem('cw-pre', '1');
        } catch (e) {}
        if (skip) el.remove();
        else { window.__cwPre = performance.now(); document.body.style.overflow = 'hidden'; }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
